# For checking against cdedb2's real types: put its checkout on MYPYPATH.
# Errors inside cdedb2 itself are not ours to report.
[mypy]
strict = True
python_version = 3.14
mypy_path = $MYPY_CONFIG_FILE_DIR:$MYPY_CONFIG_FILE_DIR/../..
plugins = ../../tplcheck/mypy_plugin.py
ignore_missing_imports = True
follow_imports = silent
cache_dir = $MYPY_CONFIG_FILE_DIR/../../../../.mypy_cache_tplcheck_cdedb2

[mypy-tplcheck.*]
disable_error_code = empty-body

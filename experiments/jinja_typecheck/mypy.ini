[mypy]
strict = True
python_version = 3.10
mypy_path = $MYPY_CONFIG_FILE_DIR:$MYPY_CONFIG_FILE_DIR/../../src:$MYPY_CONFIG_FILE_DIR/../..
plugins = tplcheck/mypy_plugin.py
cache_dir = $MYPY_CONFIG_FILE_DIR/../../.mypy_cache_tplcheck

# The typing-only helpers are stubs in spirit: their bodies are never run.
[mypy-tplcheck.*]
disable_error_code = empty-body

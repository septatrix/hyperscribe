[project]
name = "hyperscribe"
dynamic = ["version"]
description = "A small, dependency-free HTML templating engine that writes markup with context managers."
readme = "README.md"
authors = [
    { name = "Septatrix", email = "24257556+septatrix@users.noreply.github.com" }
]
requires-python = ">=3.10"
dependencies = ["typing-extensions>=4.0; python_version < '3.13'"]
keywords = ["html", "templating", "template-engine", "markup", "context-manager"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup :: HTML",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/septatrix/hyperscribe"
Repository = "https://github.com/septatrix/hyperscribe"
Issues = "https://github.com/septatrix/hyperscribe/issues"

[build-system]
requires = ["hatchling>=1.27", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
raw-options = { tag_regex = "^v(?P<version>.+)$", git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "v*"] }

[tool.hatch.build.targets.wheel]
packages = ["src/hyperscribe"]

[tool.hatch.build.targets.sdist]
include = ["src/hyperscribe", "tests", "README.md", "docs"]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8",
    "ruff>=0.8",
]
docs = [
    "furo>=2024.8.6",
    "myst-parser>=4",
    "sphinx>=8",
    "sphinx-autobuild>=2024.10.3",
    "sphinx-copybutton>=0.5.2",
]
benchmarks = [
    "airium>=0.2.6; python_version >= '3.14'",
    "ct3>=3.4.0.post5; python_version >= '3.14'",
    "dominate>=2.9.1; python_version >= '3.14'",
    "pytest-benchmark>=5; python_version >= '3.14'",
    "hyperscript>=0.3.0; python_version >= '3.14'",
    "jinja2>=3.1.6; python_version >= '3.14'",
    "legacy-cgi>=2.6.4; python_version >= '3.14'",
    "ludic>=1.0.0; python_version >= '3.14'",
    "mako>=1.4.3; python_version >= '3.14'",
    "setuptools>=84.0.0; python_version >= '3.14'",
    "tagflow>=0.12.0; python_version >= '3.14'",
    "yattag>=1.16.1; python_version >= '3.14'",
]

[tool.uv]
default-groups = ["dev", "docs"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
src = ["src", "."]
extend-exclude = ["benchmarks/generated_jinja.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests", "benchmarks"]
exclude = ["benchmarks/generated_jinja\\.py"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["benchmarks.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
warn_return_any = false

[[tool.mypy.overrides]]
module = ["Cheetah.*", "dominate.*", "hyperscript.*", "mako.*"]
ignore_missing_imports = true
